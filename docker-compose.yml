version: '3.8'

services:
  app:
    build: .
    container_name: xservisvpn
    ports:
      - "443:443"
      - "80:80"
    environment:
      - NODE_ENV=production
      - BOT_TOKEN=8140147139:AAFV2IAQxkPCpLCkqPG7D5RKS6K6t2w6M2s
      - DOMAIN=xservisvpn.ru
      - PORT=443
      - HTTP_PORT=80
    volumes:
      - ./public:/app/public:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:443/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
